<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>관리자 페이지 - 근무계획표</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        // ==========================================
        // [필수] Firebase 설정을 이곳에 붙여넣으세요
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyCmBpqXwxI0OdkG9YeR8h2YvhNFovir8Fs",
            authDomain: "interojo-tech.firebaseapp.com",
            projectId: "interojo-tech",
            storageBucket: "interojo-tech.firebasestorage.app",
            messagingSenderId: "294484133296",
            appId: "1:294484133296:web:429a662826cabb37a58275",
            measurementId: "G-87HD7CVN3X"
        };
        // ==========================================

        const appId = 'production-roster-2026';
        let db;

        // UI State
        let currentTab = 'TEAM';
        let teamData = {};
        let holidayData = {};

        window.initApp = async () => {
            // Config Check
            if (!firebaseConfig.apiKey) {
                showConfigModal();
                return;
            }

            try {
                const app = initializeApp(firebaseConfig);
                const auth = getAuth(app);
                db = getFirestore(app);

                await signInAnonymously(auth);
                document.getElementById('status').innerText = "✅ 연결됨";

                await loadData();
            } catch (e) {
                alert("연결 실패: " + e.message);
            }
        };

        async function loadData() {
            try {
                // Team
                const teamSnap = await getDoc(doc(db, 'artifacts', appId, 'config', 'teamMembers'));
                if (teamSnap.exists()) teamData = teamSnap.data();

                // Holidays
                const holidaySnap = await getDoc(doc(db, 'artifacts', appId, 'config', 'holidays'));
                if (holidaySnap.exists()) holidayData = holidaySnap.data();

                render();
            } catch (e) {
                console.error(e);
                alert("데이터 로드 실패");
            }
        }

        function render() {
            renderTeamEditor();
            renderHolidayEditor();
        }

        // --- Team Editor ---
        function renderTeamEditor() {
            const container = document.getElementById('team-container');
            container.innerHTML = '';

            ['A', 'B', 'C', 'DAY_ONLY'].forEach(team => {
                const members = teamData[team] || [];
                const card = document.createElement('div');
                card.className = "bg-white p-4 rounded shadow border";
                card.innerHTML = `
                    <h3 class="font-bold text-lg mb-2 text-indigo-700">${team === 'DAY_ONLY' ? '주간' : team + '조'}</h3>
                    <div id="list-${team}" class="space-y-2 mb-3"></div>
                    <button onclick="addMember('${team}')" class="text-xs bg-gray-100 hover:bg-gray-200 px-2 py-1 rounded">+ 추가</button>
                `;
                container.appendChild(card);

                const listDiv = card.querySelector(`#list-${team}`);

                members.forEach((name, idx) => {
                    const row = document.createElement('div');
                    row.className = "flex items-center gap-2";
                    row.innerHTML = `
                        <input type="text" value="${name}" onchange="updateMember('${team}', ${idx}, this.value)" 
                            class="border rounded px-2 py-1 text-sm w-full focus:ring-1 focus:ring-indigo-500" placeholder="이름 (빈칸=공석)">
                        <button onclick="removeMember('${team}', ${idx})" class="text-red-500 hover:bg-red-50 p-1 rounded">🗑️</button>
                    `;
                    listDiv.appendChild(row);
                });
            });
        }

        window.addMember = (team) => {
            if (!teamData[team]) teamData[team] = [];
            teamData[team].push('');
            renderTeamEditor();
        };

        window.updateMember = (team, idx, val) => {
            teamData[team][idx] = val;
        };

        window.removeMember = (team, idx) => {
            if (confirm("삭제하시겠습니까? (이 작업은 저장을 눌러야 반영됩니다)")) {
                teamData[team].splice(idx, 1);
                renderTeamEditor();
            }
        };

        window.saveTeams = async () => {
            if (!db) return;
            try {
                await setDoc(doc(db, 'artifacts', appId, 'config', 'teamMembers'), teamData);
                alert("팀원 정보가 저장되었습니다!");
            } catch (e) {
                alert("저장 실패: " + e.message);
            }
        };

        // --- Holiday Editor ---
        function renderHolidayEditor() {
            const tbody = document.getElementById('holiday-tbody');
            tbody.innerHTML = '';

            // Sort by date
            const sortedDates = Object.keys(holidayData).sort();

            sortedDates.forEach(date => {
                const name = holidayData[date];
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="p-2 border"><input type="date" value="${date}" readonly class="w-full bg-gray-50 text-gray-500"></td>
                    <td class="p-2 border"><input type="text" value="${name}" onchange="updateHoliday('${date}', this.value)" class="w-full border-0 focus:ring-0"></td>
                    <td class="p-2 border text-center"><button onclick="deleteHoliday('${date}')" class="text-red-500 hover:text-red-700">삭제</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        window.addHoliday = () => {
            const date = document.getElementById('new-holiday-date').value;
            const name = document.getElementById('new-holiday-name').value;
            if (!date || !name) {
                alert("날짜와 이름을 모두 입력해주세요.");
                return;
            }
            holidayData[date] = name;
            renderHolidayEditor();
            document.getElementById('new-holiday-date').value = '';
            document.getElementById('new-holiday-name').value = '';
        };

        window.updateHoliday = (date, newName) => {
            holidayData[date] = newName;
        };

        window.deleteHoliday = (date) => {
            delete holidayData[date];
            renderHolidayEditor();
        };

        window.saveHolidays = async () => {
            if (!db) return;
            try {
                await setDoc(doc(db, 'artifacts', appId, 'config', 'holidays'), holidayData);
                alert("공휴일 정보가 저장되었습니다!");
            } catch (e) {
                alert("저장 실패: " + e.message);
            }
        };

        // --- Tab Switching ---
        window.switchTab = (tab) => {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(`tab-${tab}`).classList.remove('hidden');

            document.querySelectorAll('.tab-btn').forEach(el => {
                if (el.id === `btn-${tab}`) el.className = "tab-btn px-4 py-2 bg-indigo-600 text-white rounded font-bold";
                else el.className = "tab-btn px-4 py-2 bg-gray-200 text-gray-600 rounded hover:bg-gray-300";
            });
        };

        // --- Config Modal ---
        function showConfigModal() {
            const configStr = prompt("firebaseConfig가 비어있습니다. Config 내용을 붙여넣어주세요 (JSON 형태 or const firebaseConfig = {...})");
            if (configStr) {
                // simple parsing attempt
                try {
                    const cleanedStr = configStr.replace(/const\s+\w+\s*=\s*/, '').replace(/;/g, '');
                    const parsed = new Function("return " + cleanedStr)();
                    Object.assign(firebaseConfig, parsed); // update global object
                    initApp(); // retry init
                } catch (e) {
                    alert("Config 파싱 실패. 다시 시도해주세요.");
                }
            }
        }

        // Init on load
        window.addEventListener('DOMContentLoaded', initApp);

    </script>
</head>

<body class="bg-slate-100 min-h-screen">
    <div class="max-w-4xl mx-auto p-4">
        <header class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-slate-800">⚙️ 관리자 페이지</h1>
            <div id="status" class="text-sm font-mono text-slate-500">연결 중...</div>
        </header>

        <!-- Tabs -->
        <div class="flex gap-2 mb-4">
            <button id="btn-TEAM" onclick="switchTab('TEAM')"
                class="tab-btn px-4 py-2 bg-indigo-600 text-white rounded font-bold">팀원 관리</button>
            <button id="btn-HOLIDAY" onclick="switchTab('HOLIDAY')"
                class="tab-btn px-4 py-2 bg-gray-200 text-gray-600 rounded">공휴일 관리</button>
            <button onclick="location.href='index.html'"
                class="ml-auto px-4 py-2 border border-indigo-600 text-indigo-600 rounded hover:bg-indigo-50">🏠
                메인으로</button>
        </div>

        <!-- TEAM Tab -->
        <div id="tab-TEAM" class="tab-content">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-semibold">팀 구성원 편집</h2>
                <button onclick="saveTeams()"
                    class="bg-green-600 text-white px-6 py-2 rounded shadow hover:bg-green-700 font-bold">💾
                    저장하기</button>
            </div>
            <div id="team-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Filled by JS -->
            </div>
        </div>

        <!-- HOLIDAY Tab -->
        <div id="tab-HOLIDAY" class="tab-content hidden">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-semibold">공휴일 관리</h2>
                <button onclick="saveHolidays()"
                    class="bg-green-600 text-white px-6 py-2 rounded shadow hover:bg-green-700 font-bold">💾
                    저장하기</button>
            </div>

            <div class="bg-white p-4 rounded shadow mb-4">
                <div class="flex gap-2">
                    <input type="date" id="new-holiday-date" class="border rounded px-2 py-1">
                    <input type="text" id="new-holiday-name" placeholder="휴일 이름 (예: 창립기념일)"
                        class="border rounded px-2 py-1 flex-1">
                    <button onclick="addHoliday()" class="bg-blue-600 text-white px-4 py-1 rounded">추가</button>
                </div>
            </div>

            <div class="bg-white rounded shadow overflow-hidden">
                <table class="w-full text-sm text-left">
                    <thead class="bg-slate-50 text-slate-500 uppercase">
                        <tr>
                            <th class="p-2 border">날짜</th>
                            <th class="p-2 border">이름</th>
                            <th class="p-2 border w-20 text-center">동작</th>
                        </tr>
                    </thead>
                    <tbody id="holiday-tbody">
                        <!-- Filled by JS -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</body>

</html>
